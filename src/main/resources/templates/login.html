<body class="bg-background min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-0 overflow-x-hidden">
<!-- Login Container -->
<main class="w-full max-w-[480px] flex flex-col gap-lg">
<!-- Brand Identity -->
<div class="flex flex-col items-center text-center gap-xs">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-base shadow-sm">
<span class="material-symbols-outlined text-primary-fixed-dim text-[32px]" data-icon="apartment">apartment</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">CondoPro</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px]">
                Gestión administrativa premium para propiedades exclusivas.
            </p>
</div>
<!-- Form Card -->
<section class="bg-surface-container-lowest rounded-[24px] p-lg login-shadow border border-outline-variant/10">
<form class="flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider ml-1" for="email">Correo electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline-variant" id="email" placeholder="nombre@ejemplo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center ml-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Contraseña</label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between mt-xs">
<label class="flex items-center gap-xs cursor-pointer group">
<input class="rounded-sm border-outline-variant text-primary focus:ring-primary w-4 h-4" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
</label>
<a class="font-body-sm text-body-sm font-semibold text-secondary hover:text-primary transition-colors" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-body-md font-bold hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-sm mt-sm shadow-md" type="submit">
                    Iniciar Sesión
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Social Login / Separator -->
<div class="mt-lg flex flex-col gap-md">
<div class="flex items-center gap-md">
<div class="h-[1px] bg-outline-variant flex-1"></div>
<span class="font-label-caps text-label-caps text-outline">O continuar con</span>
<div class="h-[1px] bg-outline-variant flex-1"></div>
</div>
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-xs py-3 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">

<span class="material-symbols-outlined text-on-surface" data-icon="apple">ios</span>
<span class="font-body-sm text-body-sm font-medium">Apple</span>

</div>
</div>
</section>

<footer class="flex flex-col items-center gap-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                ¿No tienes una cuenta? <a class="font-semibold text-primary hover:underline" href="#">Contacta a tu administrador</a>
</p>
<div class="flex gap-lg">
<a class="font-label-caps text-[10px] text-outline uppercase tracking-widest hover:text-on-surface-variant transition-colors" href="#">Soporte</a>
<a class="font-label-caps text-[10px] text-outline uppercase tracking-widest hover:text-on-surface-variant transition-colors" href="#">Privacidad</a>
<a class="font-label-caps text-[10px] text-outline uppercase tracking-widest hover:text-on-surface-variant transition-colors" href="#">Términos</a>

<div class="absolute -right-[10%] -top-[10%] w-[60%] h-[60%] rounded-full bg-gradient-to-br from-primary-fixed/20 to-transparent blur-[120px]"></div>
